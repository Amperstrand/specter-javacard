      INTERNAL_ERROR: 0x9CFF

# Common proven flows (conformance scripts drive exactly these):
flows:
  battery: "select -> get_status(version) -> init_sc -> verify_pin -> [get_extended_key(m/84h/0h/0h/0/i, P2=0x00) -> sign_transaction_hash(0xFF, sha256(msg)) -> host-verify via recovered pubkey] xN"
  personalize: "select -> get_status -> init_sc -> SETUP -> verify_pin -> BIP32_IMPORT_SEED(32B zero-value test seed) -> get_status(seeded)"

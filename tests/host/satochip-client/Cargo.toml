[package]
name = "satochip-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SatoChip smartcard protocol client — constants generated from the pinned-tag contract (tests/host/spec/satochip-protocol.yaml), conformance-tested against the vpcd version farm"

[dependencies]
k256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
pcsc = "2.9"
hex = "0.4"
